preprocess:
  max_long_edge: 1500
  tone_mode: shaded
  auto_exif: true
  auto_rotate_ocr:
    enabled: true
    method: pulc
    max_long_edge: 1500
  perspective:
    enabled: true
    min_area_ratio: 0.08
    approx_epsilon_ratios:
    - 0.02
    - 0.03
    - 0.045
    - 0.06
    max_detect_long_edge: 1500
    rect_area_expand_ratio: 0.2
page_text:
  subdir: pages
  manifest: pages.jsonl
vlm:
  model: qwen3.5-plus
  max_workers: 8
  max_long_edge: 1500
  use_preprocess: true
  temperature: 0.1
  timeout_seconds: 300.0
delivery:
  merge_key: 款号
  header_keys: []
  line_keys:
  - 款号
  - 颜色
  - XS
  - S
  - M
  - L
  - XL
  - XXL
  - 小计
